# Based on al-folio 8ec1f360; theme behavior is supplied by versioned gems.
---
title: blank
first_name: David
middle_name: M.
last_name: Liu
description: Assistant Research Professor at Cornell University
footer_text: Powered by <a href="https://jekyllrb.com/">Jekyll</a> with <a href="https://github.com/alshedivat/al-folio">al-folio</a>.
  Hosted by <a href="https://pages.github.com/">GitHub Pages</a>.
lang: en
url: https://dliu18.github.io
baseurl: ""
navbar_fixed: true
enable_navbar_social: true
footer_fixed: false
max_width: 930px
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: false
      start_line: 1
theme: al_folio_core
sass:
  style: compressed
external_links:
  enabled: true
  rel: external nofollow noopener
  target: _blank
  exclude:
lazy_loading_images: true
enable_darkmode: true
third_party_libraries:
  download: false
  fontawesome:
    integrity:
      css: sha256-MVopmdyC2tYTiJ8wlktf0uh0v4NgT+vNdyVFepi7Q0c=
    url:
      css: https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@{{version}}/css/all.min.css
    version: 7.2.0
  academicons:
    integrity:
      css: sha256-SzrCOBJbGVFMahewkgjwnApaV2+av1DwMAA+/QGLyZw=
    url:
      css: https://cdn.jsdelivr.net/npm/academicons@{{version}}/css/academicons.min.css
    version: 1.9.5
  google_fonts:
    url:
      fonts: https://fonts.googleapis.com/css?family=Roboto:300,400,500,700|Roboto+Slab:100,300,400,500,700|Material+Icons&display=swap
  scholar-icons:
    integrity:
      css: sha256-VY3hHVj/hNX3fYG6wtbA6TcKJQl7+FthzGSyIB64klY=
    url:
      css: https://cdn.jsdelivr.net/npm/scholar-icons@{{version}}/css/scholar-icons.css
    version: 1.0.3
contact_note: ""
icon: favicon.svg
timezone: America/New_York
analytics:
  google: G-9786S8E7XK
al_folio:
  api_version: 1
  style_engine: tailwind
  tailwind:
    version: 4.1.18
    preflight: false
    css_entry: assets/tailwind/app.css
  distill:
    engine: distillpub-template
    source: al-org-dev/distill-template#al-folio
    allow_remote_loader: false
  compat:
    bootstrap:
      enabled: false
  upgrade:
    channel: stable
    auto_apply_safe_fixes: false
plugins:
  - jekyll-3rd-party-libraries
  - jekyll-cache-bust
  - jekyll-feed
  - jekyll-link-attributes
  - jekyll-regex-replace
  - jekyll/scholar
  - jekyll-sitemap
  - jekyll-socials
  - jekyll-redirect-from
  - al_folio_core
  - al_icons
  - al_analytics
  - al_citations
  - al_folio_upgrade
include:
  - _pages
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - docs
  - package.json
  - package-lock.json
  - vendor
  - node_modules
  - TODO.md
  - al-folio-upgrade-report.md
defaults:
  - scope:
      path: assets
    values:
      sitemap: false
  - scope:
      path: files
    values:
      sitemap: false
scholar:
  last_name:
    - Liu
  first_name:
    - David
    - D.
    - David M.
  style: apa
  locale: en
  source: "/_bibliography/"
  bibliography: papers.bib
  bibliography_template: bib
  bibtex_filters:
    - latex
    - smallcaps
    - superscript
  replace_strings: true
  join_strings: true
  query: "@*"
  group_by: none
  group_order: descending
  sort_by: none
enable_publication_thumbnails: true
max_author_limit:
filtered_bibtex_keywords:
  - paper
  - abbr
  - abstract
  - additional_info
  - altmetric
  - annotation
  - arxiv
  - award
  - award_name
  - bibtex_show
  - blog
  - code
  - dimensions
  - eprint
  - google_scholar_id
  - hal
  - html
  - inspirehep_id
  - pdf
  - pmid
  - poster
  - preview
  - selected
  - slides
  - supp
  - video
  - website
